<!DOCTYPE html>
<html lang="tr">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    NOT — 28 Ağustos 2026: BU SATIRI SİLME.

    Bu satır bir ara index.html özelleştirilirken düşmüş. Yokken iPhone
    Safari sayfanın 980 piksel genişliğinde olduğunu varsayıp ekrana
    sığdırmak için küçültüyor. Sonuç: uygulama çizildikten sonra yeniden
    ölçekleniyor, yazılar kayarken bulanıklaşıyor ve Yunus'un tarifiyle
    "iç içe geçmiş gibi" akıyor. Flutter'ın kendi şablonunda bu satır
    vardır; özelleştirme yaparken korunmalı.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="description" content="KPSS NET — yapay zekâ destekli KPSS hazırlık koçun: günlük plan, soru çözümü, bilgi kartları ve denemeler.">
  <meta name="theme-color" content="#0F8060">

  <!-- iOS meta tags & icons -->
  <!--
    NOT — 13 Ağustos 2026: iPhone klavye sorunu (artık tekrarlamıyor)

    Aşağıdaki "apple-mobile-web-app-capable = yes", iPhone'a uygulamayı
    ana ekrandan tam ekran (standalone) kipinde açmasını söyler.

    O gün bir kez şu yaşandı: ana ekrana eklenen uygulamada giriş
    ekranındaki e-posta/şifre alanlarına dokununca KLAVYE AÇILMADI; aynı
    sayfa normal Safari sekmesinde sorunsuz çalışıyordu. Sonradan
    kendiliğinden düzeldi, sebebi anlaşılmadı.

    Tam ekran kipini kapatmak (bu satırları "no" + manifest display
    "browser") klavyeyi çalıştırıyor ama üstte Safari adres çubuğu
    çıkarıyor; Yunus bunu reddetti ve gerek de kalmadı.

    Tekrarlarsa: önce ana ekran simgesini silip yeniden ekletmeyi dene
    (iPhone ayarları ekleme anında saklıyor), sonra Flutter yükseltmesine
    bak. Şu an 3.44.9 kullanılıyor.
  -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KPSS NET">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KPSS NET</title>
  <link rel="manifest" href="manifest.json">

  <!--
    iOS Safari klavye düzeltmesi — 14 Ağustos 2026

    SORUN: iOS'ta klavye açılınca Safari, sayfanın DÜZEN alanını değil
    yalnızca GÖRÜNEN alanını küçültür ve sayfayı yukarı kaydırır. Flutter
    bunu bilmediği için mesaj yazma kutusu ve mesajlar ekranın dışına
    fırlıyordu.

    ÇÖZÜM: (1) sayfanın kendisi hiç kaymasın, (2) uygulama yüksekliği
    Safari'nin bildirdiği GÖRÜNEN alana sabitlensin. Böylece klavye
    açıldığında uygulama tam olarak kalan boşluğa oturur; yazma kutusu
    klavyenin hemen üstünde, mesajlar onun üstünde kalır.

    Bu yalnızca web sürümünü etkiler; APK'da böyle bir sorun yok.
  -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      /* Sayfa kaymasın: iOS'un klavye açılınca yaptığı kaydırma böylece
         devre dışı kalıyor. */
      position: fixed;
      overflow: hidden;
      width: 100%;
      /* --gorunen-yukseklik aşağıdaki betikle güncelleniyor; betik hiç
         çalışmazsa 100vh'ye düşer ve eski davranış korunur. */
      height: var(--gorunen-yukseklik, 100vh);
    }
  </style>
  <script>
    (function () {
      // visualViewport, tarayıcının GERÇEKTEN görünen alanını bildirir —
      // klavye açıkken bu alan küçülür. Desteklemeyen tarayıcılarda
      // hiçbir şey yapmıyoruz, CSS'teki 100vh yedeği devreye giriyor.
      var vv = window.visualViewport;
      if (!vv) return;

      function olcuyuUygula() {
        document.documentElement.style.setProperty(
          '--gorunen-yukseklik', vv.height + 'px');
        // iOS klavye açılırken sayfayı kaydırmış olabilir; başa al.
        window.scrollTo(0, 0);
      }

      vv.addEventListener('resize', olcuyuUygula);
      vv.addEventListener('scroll', olcuyuUygula);
      window.addEventListener('orientationchange', function () {
        setTimeout(olcuyuUygula, 250);
      });
      olcuyuUygula();
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Firebase JS kütüphanesi — BİLEREK elle yükleniyor.

    ⚠️ `firebase_core_web` paketi bunu normalde kendisi enjekte ediyor,
    ama `--wasm` derlemesinde enjeksiyon HİÇ çalışmadı: sayfada tek bir
    gstatic betiği yoktu ve `Firebase.initializeApp` "başlatılamadı"
    diye düşüyordu (2 Eylül 2026, tarayıcıdan ölçüldü). Paketin kendi
    kodu "kullanıcı betikleri kendi eklediyse atla" diyor; biz de tam
    olarak onu yapıyoruz.

    ⚠️ Flutter ancak modüller yüklendikten SONRA başlatılıyor. Sırayı
    tarayıcıya bırakırsak Flutter önce başlar ve yine bulamaz.

    Sürüm paketin beklediğiyle aynı olmak zorunda:
    firebase_core_web/lib/src/firebase_sdk_version.dart → 12.18.0
  -->
  <script type="module">
    const SURUM = '12.18.0';
    const KOK = 'https://www.gstatic.com/firebasejs/' + SURUM + '/';

    async function firebaseYukle() {
      // Paket bu global adlara bakıyor; adlar birebir aynı olmalı.
      window.firebase_core = await import(KOK + 'firebase-app.js');
      window.firebase_messaging = await import(KOK + 'firebase-messaging.js');
      window.flutterfire_web_sdk_version = SURUM;
    }

    async function baslat() {
      try {
        await firebaseYukle();
      } catch (e) {
        // Bildirim çalışmasa da uygulama açılmalı; sebebi konsolda
        // görünsün diye yazıyoruz.
        console.error('[KPSS NET] Firebase JS yüklenemedi:', e);
      }
      const b = document.createElement('script');
      b.src = 'flutter_bootstrap.js';
      b.async = true;
      document.body.appendChild(b);
    }

    baslat();
  </script>
</body>
</html>
